name: Deploy

# Publishes main to GitHub Pages on every push. Tests run locally before a pull request is merged (see the release
# skill); the build here still validates every data file, so a commit that doesn't build is never deployed. It also
# republishes main each Monday, so brands' own photos of their models (see below) stay current between commits.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer commit's deploy waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The photos a brand's own pages show for each model change as its site does. A page that can't be read keeps
      # the photo found before if it still loads, and drops it otherwise, so this never stops a deploy.
      - name: Refresh brands' own model photos
        run: npm run photos:official || true
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
